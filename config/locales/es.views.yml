          sign_up_for_tracking_progress_html: |
            Curso gratuito de %{name}. <a href="%{link}" class="text-decoration-none" target="_blank">Regístrate</a> para hacer un seguimiento de tu progreso &rarr;
          instructions: Tarea
          definitions: Definiciones
          tips: Consejos útiles
          common_questions:
            - question: ¿El ejercicio no pasa la prueba, qué debo hacer? 😶
              answer: |
                Si te quedaste atascado, es el momento perfecto para hacer una pregunta en las "Discusiones". 
                * Asegúrate de incluir la salida de las pruebas. Sin ella, es casi imposible entender qué está mal, incluso si muestras tu código. Los programadores tienen dificultades para ejecutar el código en su mente, pero casi siempre es posible entender a dónde mirar a partir del error que recibiste.
            - question: Mi código funciona en mi entorno, pero no aquí 🤨
              answer: |
                Las pruebas están diseñadas de manera que verifican la solución de diferentes maneras y con diferentes datos. A menudo, una solución funciona con ciertos datos de entrada pero no con otros. Para entender este punto, revisa la pestaña "Pruebas" y presta atención a los mensajes de error, que suelen contener pistas.
            - question: Mi código es diferente a la solución del profesor 🤔
              answer: |
                Esto es normal 🙆. En programación, una tarea puede tener muchas soluciones diferentes. Si tu código pasa la prueba, cumple con los requisitos de la tarea.

                En raras ocasiones, la solución puede estar ajustada para pasar las pruebas, pero esto suele ser evidente.
            - question: Leí la lección, pero no entendí nada 🙄
              answer: |
                Crear materiales de aprendizaje comprensibles para todos es bastante difícil. Hacemos nuestro mejor esfuerzo, pero siempre hay margen para mejorar. Si encuentras material que no entiendes, describe el problema en las "Discusiones". Es ideal si puedes formular los aspectos que no entiendes en forma de preguntas. Por lo general, necesitamos unos días para hacer mejoras.

                Por cierto, tú también puedes contribuir a mejorar los cursos: en la parte inferior hay un enlace al código fuente de las lecciones, que se puede modificar directamente en el navegador.
